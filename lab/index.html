<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab · Spectualize</title>
<!-- Lab in prova: fuori dal menu, dalla sitemap e dai motori finché Matteo non decide -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1EAE0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Prototipo Lab (14/10/2026). Testi: Portale/lab-testi-v1.md. Stessi colori, caratteri e fondo del portale.
     Indice #/ + 6 esperimenti #/configuratore, #/scroll-di-prodotto, #/banner-interattivo, #/luci-di-scena, #/parete-digitale, #/invito-su-misura.
     Versione precedente con Fluido: lab-v1-fluido-luci.html */
  :root {
    --cream: #F1EAE0;
    --ink: #1A1210;
    --ink-mid: rgba(26,18,16,0.58);
    --ink-strong: rgba(26,18,16,0.82);
    --ink-soft: rgba(26,18,16,0.35);
    --hairline: rgba(26,18,16,0.12);
    --panel: rgba(252,249,245,.88);
    --stage: #140D0B;
    --orange: #FF7A2A;
    --coral: #FF3D6E;
    --magenta: #E91FA8;
    --pink: #FF1CD6;
    --grad: linear-gradient(100deg, var(--orange) 0%, var(--coral) 35%, var(--magenta) 70%, var(--pink) 100%);
    --sans: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --gut: clamp(16px, 3vw, 32px);
    --logo-h: clamp(44px, 4.4vw, 60px);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { background: var(--cream); }
  body { background: var(--cream); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button, a { color: inherit; font: inherit; cursor: pointer; }
  button { background: none; border: 0; }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
  .grain {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0 0.06  0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 240px;
  }
  .wrap { padding-inline: var(--gut); max-width: 1680px; margin-inline: auto; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .hl { font-weight: 500; background-image: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* prototipo: etichetta in alto */
  .proto-tag { position: fixed; top: 10px; left: 50%; translate: -50% 0; pointer-events: none; z-index: 60; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--cream); font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  .site-head { position: relative; z-index: 5; padding-block: var(--gut); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .site-head .mark { height: var(--logo-h); width: auto; display: block; }
  .site-head nav { display: flex; align-items: center; gap: clamp(14px,2.4vw,32px); }
  .site-head nav a { text-decoration: none; font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-strong); }
  .site-head nav a.on { color: var(--ink); padding-bottom: 5px; margin-bottom: -5px; background: var(--grad) left bottom / 100% 2px no-repeat; }

  .btn { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; white-space: nowrap; background: var(--ink); color: var(--cream); padding: 15px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; transition: transform .25s ease; }
  .btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 14px rgba(255,122,42,.8); }
  .btn:hover { transform: translateY(-2px); }
  .btn.light { background: var(--cream); color: var(--ink); }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; }

  .kicker { display: flex; align-items: center; gap: 10px; color: var(--ink-strong); font-size: 12px; }
  .kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--magenta)); box-shadow: 0 0 14px var(--c, var(--magenta)); }
  .claim { font-weight: 300; font-size: clamp(40px, 6.4vw, 100px); line-height: .98; letter-spacing: -.045em; text-wrap: balance; }
  .lede { margin-top: clamp(18px,3vh,28px); max-width: 34em; font-size: clamp(17px,1.4vw,20px); line-height: 1.5; color: var(--ink-strong); }

  /* ---------- Indice ---------- */
  .lab-hero { padding-block: clamp(24px,7vh,88px) clamp(32px,6vh,72px); }
  .lab-hero .claim { margin-top: 18px; max-width: 13ch; }
  .bento { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); grid-auto-rows: clamp(220px, 26vh, 300px); gap: 14px; }
  .card { position: relative; overflow: hidden; border-radius: 22px; text-decoration: none; isolation: isolate; background: #EDE4D8; box-shadow: inset 0 0 0 1px var(--hairline); --c: var(--orange); }
  .card.dark { background: var(--stage); color: var(--cream); box-shadow: none; }
  .card:nth-child(1) { grid-column: span 4; grid-row: span 2; }
  .card:nth-child(2) { grid-column: span 2; grid-row: span 2; }
  .card:nth-child(3) { grid-column: span 2; }
  .card:nth-child(4) { grid-column: span 4; }
  .card:nth-child(5) { grid-column: span 3; }
  .card:nth-child(6) { grid-column: span 3; }
  .card .pv { position: absolute; inset: 0; z-index: -1; }
  .card canvas, .card svg.pv { width: 100%; height: 100%; display: block; }
  .card .meta { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(16px,1.6vw,24px); pointer-events: none; }
  .card .top { display: flex; justify-content: space-between; gap: 12px; }
  .card .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--panel); color: var(--ink); }
  .card .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .card .num { padding: 6px 0; }
  .card .name { font-size: clamp(26px, 2.6vw, 40px); font-weight: 400; letter-spacing: -.03em; line-height: 1; display: flex; align-items: center; gap: 12px; }
  .card:nth-child(1) .name { font-size: clamp(34px, 4vw, 64px); }
  .card .name b { font-weight: 300; font-size: .6em; transition: transform .35s cubic-bezier(.16,1,.3,1); }
  .card:hover .name b { transform: translateX(6px); }
  .card .line { margin-top: 8px; max-width: 30ch; font-size: 15px; line-height: 1.4; opacity: .82; }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%; z-index: 0; pointer-events: none; background: linear-gradient(to top, rgba(241,234,224,.92) 8%, rgba(241,234,224,0)); }
  .card.dark::after { background: linear-gradient(to top, rgba(20,13,11,.86) 8%, rgba(20,13,11,0)); }
  .card .meta { z-index: 1; }
  .origin { margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; color: var(--ink-strong); text-decoration: none; }
  .origin i { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); }

  /* configuratore */
  .cfg { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(300px,1fr); min-height: min(78vh, 760px); }
  .cfg-stage { position: relative; display: grid; place-items: center; perspective: 900px; background: radial-gradient(60% 55% at 50% 50%, #FBF7F1 0%, #EDE4D8 75%); overflow: hidden; }
  .cfg-stage svg { width: min(78%, 420px); height: auto; overflow: visible; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .cfg-stage svg * { transition: fill .55s ease, stroke .55s ease, opacity .55s ease; }
  .cfg-panel { padding: clamp(20px,3vw,40px); display: flex; flex-direction: column; gap: 26px; background: var(--panel); border-left: 1px solid var(--hairline); }
  .cfg-g h3 { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mid); display: flex; justify-content: space-between; }
  .cfg-g h3 b { font-weight: 500; color: var(--ink); }
  .cfg-g .row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
  .cfg-g .sw { width: 40px; height: 40px; }
  .cfg-sum { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--hairline); }
  .cfg-sum p:first-child { font-size: clamp(22px, 2vw, 30px); letter-spacing: -.02em; }
  .cfg-sum .mono { display: block; margin-top: 8px; color: var(--ink-mid); }
  .cfg-sum .btn { margin-top: 18px; }

  /* invito */
  .card canvas.inv-pv { position: absolute; top: 12%; right: 7%; height: 96%; width: auto; aspect-ratio: 4/5; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5); transform: rotate(-6deg); transform-origin: top right; }
  .inv { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: clamp(20px,4vw,56px); align-items: center; padding: clamp(20px,3.5vw,48px); }
  .inv canvas { width: 100%; max-width: 480px; aspect-ratio: 4/5; height: auto; display: block; justify-self: center; border-radius: 18px; box-shadow: 0 30px 70px rgba(26,18,16,.28); }
  .inv-form { display: flex; flex-direction: column; gap: 22px; }
  .inv-form label { display: flex; flex-direction: column; gap: 10px; }
  .inv-form input[type=text] { font: inherit; font-size: clamp(20px, 1.8vw, 26px); font-weight: 300; padding: 14px 16px; border-radius: 14px; border: 0; background: var(--panel); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink); width: 100%; }
  .inv-form input[type=text]:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .inv-form .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .inv-form .note { color: var(--ink-mid); font-size: 15px; line-height: 1.45; }

  .lab-close { padding-block: clamp(72px, 14vh, 160px) clamp(48px,8vh,96px); }
  .lab-close .claim { font-size: clamp(38px, 5.6vw, 88px); max-width: 14ch; }
  .lab-close .btn { margin-top: clamp(24px,4vh,40px); }
  .site-foot { padding-block: 28px 36px; text-align: center; color: var(--ink-soft); }

  /* banner in anteprima */
  /* anteprima del banner: il gradiente copre la scheda e un gesto lo "gratta" via, scoprendo il messaggio */
  .pv-banner { background: #F6F0E7; }
  .pv-banner .msg { position: absolute; left: 0; right: 0; top: 62px; text-align: center; font-size: clamp(20px, 1.7vw, 26px); letter-spacing: -.03em; line-height: 1.05; }
  .pv-banner .msg .mono { display: block; margin-bottom: 8px; font-size: 10px; letter-spacing: .14em; color: var(--ink-mid); }
  .pv-banner .veil { position: absolute; inset: 0; background: var(--grad); -webkit-mask: radial-gradient(circle at var(--x,50%) var(--y,50%), transparent var(--r,0px), #000 calc(var(--r,0px) + 1px)); mask: radial-gradient(circle at var(--x,50%) var(--y,50%), transparent var(--r,0px), #000 calc(var(--r,0px) + 1px)); }

  /* ---------- Pagina esperimento ---------- */
  .ex-hero { padding-block: clamp(16px,5vh,64px) clamp(24px,4vh,44px); display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: clamp(20px,4vw,64px); align-items: end; }
  .ex-hero .claim { margin-top: 14px; }
  .ex-hero .lede { margin-top: 0; }
  .back { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; padding: 9px 16px 9px 9px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--hairline); text-decoration: none; color: var(--ink-strong); transition: box-shadow .25s, transform .25s; }
  .back b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--cream); font-weight: 400; font-size: 15px; letter-spacing: 0; transition: transform .25s; }
  .back:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .back:hover b { transform: translateX(-3px); }
  .demo { position: relative; border-radius: 26px; overflow: hidden; isolation: isolate; }
  .demo.cream { background: #EDE4D8; box-shadow: inset 0 0 0 1px var(--hairline); }
  .demo.dark { background: var(--stage); color: var(--cream); }
  .demo canvas.full { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .demo.cream canvas.full { mix-blend-mode: multiply; }
  .tall { height: min(76vh, 760px); min-height: 420px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px; border-radius: 18px; background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink); }
  .demo > .controls { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 3; }
  .ctl { display: flex; align-items: center; gap: 10px; }
  .ctl > span { color: var(--ink-mid); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hairline); }
  .seg button { padding: 7px 12px; border-radius: 999px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .sw { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(26,18,16,.2); position: relative; overflow: hidden; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--cream), 0 0 0 3.5px var(--ink); }
  .colors { display: flex; gap: 8px; }
  .colors label { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(26,18,16,.2); }
  .colors input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border: 0; padding: 0; cursor: pointer; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 130px; height: 24px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--ink-soft); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--ink-soft); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -8px; border-radius: 50%; background: var(--ink); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--ink); }
  .controls .btn { padding: 11px 16px; font-size: 14px; margin-left: auto; }
  .hint { position: absolute; top: 18px; left: 18px; z-index: 2; pointer-events: none; padding: 7px 12px; border-radius: 999px; background: var(--panel); color: var(--ink); }
  .demo.dark .hint { background: rgba(241,234,224,.12); color: var(--cream); }

  .use { padding-block: clamp(48px,9vh,110px) 0; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap: clamp(20px,4vw,64px); }
  .use h2 { font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mid); padding-top: 10px; }
  .use p { font-size: clamp(22px, 2.4vw, 36px); font-weight: 300; line-height: 1.22; letter-spacing: -.02em; text-wrap: pretty; }
  .ex-next { margin-top: clamp(56px,10vh,120px); padding-block: 28px; border-top: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .ex-next a.nx { text-decoration: none; display: flex; flex-direction: column; gap: 8px; }
  .ex-next a.nx span:last-child { font-size: clamp(26px, 3vw, 44px); letter-spacing: -.03em; }
  .ex-next a.nx:hover b { transform: translateX(6px); }
  .ex-next a.nx b { display: inline-block; font-weight: 300; transition: transform .35s cubic-bezier(.16,1,.3,1); }

  /* scroll di prodotto */
  .sp-track { position: relative; height: 340vh; }
  .sp-stage { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); align-items: center; gap: clamp(16px,4vw,64px); padding-block: 24px; }
  .sp-obj { position: relative; height: 100%; max-height: 760px; display: grid; place-items: center; border-radius: 26px; background: radial-gradient(60% 55% at 50% 55%, #F8F2EA 0%, #EDE4D8 70%); box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; }
  .sp-obj svg { position: absolute; inset: 6% 4%; width: 92%; height: 88%; overflow: visible; }
  .sp-text { position: relative; min-height: 260px; }
  .sp-ch { position: absolute; inset: 0 0 auto 0; }
  .sp-ch h3 { margin-top: 14px; font-size: clamp(40px, 5vw, 80px); font-weight: 300; letter-spacing: -.045em; line-height: 1; }
  .sp-ch p { margin-top: 18px; max-width: 26em; font-size: clamp(17px,1.4vw,20px); line-height: 1.5; color: var(--ink-strong); }
  .sp-ch .ph { margin-top: 14px; color: var(--ink-soft); }
  .sp-bar { display: flex; gap: 6px; margin-bottom: 26px; }
  .sp-bar i { height: 2px; flex: 1; background: var(--hairline); position: relative; overflow: hidden; }
  .sp-bar i::after { content: ""; position: absolute; inset: 0; background: var(--grad); transform-origin: left; transform: scaleX(var(--f, 0)); }
  .sp-cue { position: absolute; bottom: 22px; left: 50%; translate: -50% 0; color: var(--ink-mid); }

  /* banner interattivo */
  .bn-area { padding: clamp(28px,5vw,64px) clamp(16px,3vw,40px); display: flex; flex-wrap: wrap; gap: clamp(24px,4vw,56px); align-items: flex-start; justify-content: center; }
  .bn-col { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .bn-col > .mono { color: var(--ink-mid); }
  .bn { position: relative; overflow: hidden; border-radius: 6px; background: #FBF7F1; box-shadow: 0 24px 60px rgba(26,18,16,.16), inset 0 0 0 1px var(--hairline); user-select: none; -webkit-user-select: none; }
  .bn.m { width: 300px; height: 250px; }
  .bn.s { width: 320px; height: 100px; }
  .bn .ad { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 22px; gap: 8px; }
  .bn.s .ad { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 16px; }
  .bn .ad .k { color: var(--ink-mid); font-size: 10px; }
  .bn .ad .h { font-size: 27px; line-height: 1.02; letter-spacing: -.035em; font-weight: 400; }
  .bn.s .ad .h { font-size: 19px; }
  .bn .ad .go { align-self: flex-start; margin-top: 8px; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--cream); font-size: 13px; font-weight: 500; }
  .bn.s .ad .go { margin: 0; align-self: center; }
  .bn .ad .go.pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .bn canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .bn .tag { position: absolute; top: 6px; right: 8px; z-index: 2; font-family: var(--mono); font-size: 9px; color: var(--ink-soft); letter-spacing: .1em; }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); border-top: 1px solid var(--hairline); }
  .stats div { padding: 18px clamp(12px,1.6vw,22px); border-left: 1px solid var(--hairline); }
  .stats div:first-child { border-left: 0; }
  .stats b { display: block; margin-top: 8px; font-size: clamp(26px, 2.6vw, 40px); font-weight: 300; letter-spacing: -.03em; }
  .stats-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px clamp(12px,1.6vw,22px); border-top: 1px solid var(--hairline); color: var(--ink-mid); }
  .stats-head button { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  /* luci */
  .stage-box { aspect-ratio: 16/8.4; min-height: 440px; max-height: 78vh; width: 100%; }
  .stage-box::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 1; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,.55), transparent); }
  .stage-box .boards { position: absolute; left: 50%; bottom: 13%; translate: -50% 0; width: 46%; height: 3px; z-index: 2; border-radius: 3px; background: rgba(241,234,224,.16); }
  .controls.dk { background: rgba(26,18,16,.72); color: var(--cream); box-shadow: inset 0 0 0 1px rgba(241,234,224,.14); }
  .controls.dk .ctl > span { color: rgba(241,234,224,.6); }
  .controls.dk .seg { box-shadow: inset 0 0 0 1px rgba(241,234,224,.2); }
  .controls.dk .seg button { color: rgba(241,234,224,.85); }
  .controls.dk .seg button[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
  .controls.dk .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--stage), 0 0 0 3.5px var(--cream); }
  .controls.dk .btn { background: var(--cream); color: var(--ink); }

  /* parete */

  function viewConfig(x){
    const sw = (k, list, sel) => list.map(([n, v], i) => `<button class="sw" aria-pressed="${i === sel}" data-k="${k}" data-i="${i}" aria-label="${n}" title="${n}" style="background:${v.startsWith('url') ? 'var(--grad)' : v}"></button>`).join('');
    exPage(x, `
      <div class="demo cream">
        <div class="cfg">
          <div class="cfg-stage" id="cfgStage">${SPEAKER}<p class="hint mono">${touchLike ? 'Trascina per inclinarla' : 'Muovi il cursore per inclinarla'}</p></div>
          <div class="cfg-panel">
            <div class="cfg-g"><h3>Colore <b id="cfgC"></b></h3><div class="row">${sw('color', CFG.color, 3)}</div></div>
            <div class="cfg-g"><h3>Finitura <b id="cfgF"></b></h3><div class="row seg" style="box-shadow:none;padding:0;gap:8px">${CFG.finish.map(([n], i) => `<button aria-pressed="${i === 1}" data-k="finish" data-i="${i}" style="box-shadow:inset 0 0 0 1px var(--hairline)">${n}</button>`).join('')}</div></div>
            <div class="cfg-g"><h3>Dettagli <b id="cfgA"></b></h3><div class="row">${sw('accent', CFG.accent, 2)}</div></div>
            <div class="cfg-sum"><p id="cfgName"></p><span class="mono" id="cfgCode"></span><a class="btn" href="#/configuratore" id="cfgBuy"><span class="dot"></span>Aggiungi al carrello</a></div>
          </div>
        </div>
      </div>`, () => {
      const stage = $('#cfgStage'), svg = stage.querySelector('svg'), set = speaker(svg);
      const sel = { color: 3, finish: 1, accent: 2 };
      const apply = pop => {
        const c = CFG.color[sel.color], f = CFG.finish[sel.finish], a = CFG.accent[sel.accent];
        set(c[1], f[1], a[1]);
        $('#cfgC').textContent = c[0]; $('#cfgF').textContent = f[0]; $('#cfgA').textContent = a[0];
        $('#cfgName').textContent = `Cassa Uno · ${c[0]} · ${f[0]} · ${a[0]}`;
        $('#cfgCode').textContent = 'Modello CU-' + [c[0], f[0], a[0]].map(w => w.slice(0, 2).toUpperCase()).join('-') + ' · prodotto di esempio';
        if (pop) svg.animate([{ scale: 1 }, { scale: 1.04 }, { scale: 1 }], { duration: 500, easing: 'cubic-bezier(.3,0,.2,1)' });
      };
      apply(false);
      document.querySelectorAll('.cfg-panel [data-k]').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k; sel[k] = +b.dataset.i;
        document.querySelectorAll(`.cfg-panel [data-k="${k}"]`).forEach(o => o.setAttribute('aria-pressed', o === b));
        apply(true);
      }));
      // la cassa si inclina verso il cursore o il dito
      const tilt = e => { const r = stage.getBoundingClientRect(); const dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5; svg.style.transform = `rotateY(${(dx * 28).toFixed(1)}deg) rotateX(${(-dy * 14).toFixed(1)}deg)`; };
      listen(stage, 'pointermove', tilt);
      listen(stage, 'pointerleave', () => { svg.style.transform = ''; });
      $('#cfgBuy').addEventListener('click', e => { e.preventDefault(); toast('Nel negozio vero, qui parte l\'acquisto. E ogni combinazione scelta finisce nei dati di vendita.'); });
    });
  }

  function viewScroll(x){
    const CH = [
      ['Forma', 'Linee pulite e proporzioni studiate: il primo sguardo racconta già il carattere del prodotto.'],
      ['Materia', 'Vetro, colore, superficie. Ogni materiale entra in scena quando serve al racconto.'],
      ['Dettaglio', 'Lo zoom arriva dove conta: il prodotto si apre e mostra ciò che lo rende unico.']
    ];
    exPage(x, `
      <section class="sp-track" id="sp">
        <div class="sp-stage">
          <div class="sp-obj">${BOTTLE}<p class="sp-cue mono">Scorri ↓</p></div>
          <div class="sp-text">
            <div class="sp-bar">${CH.map(() => '<i></i>').join('')}</div>
            <div style="position:relative">
              ${CH.map(([t, p], k) => `<div class="sp-ch" data-ch="${k}"><p class="kicker mono"><i></i>Capitolo ${k + 1} di 3</p><h3>${t}</h3><p>${p}</p><p class="ph mono">Testo segnaposto</p></div>`).join('')}
            </div>
          </div>
        </div>
      </section>`, () => {
      const track = $('#sp'), svg = track.querySelector('svg'), set = bottle(svg);
      const chs = [...track.querySelectorAll('.sp-ch')], bars = [...track.querySelectorAll('.sp-bar i')], cue = track.querySelector('.sp-cue');
      const sm = { p: 0 };
      const ease = v => v < .5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2;
      const seg = (p, a, b) => Math.max(0, Math.min(1, (p - a) / (b - a)));
      let shown = -1;
      loop((dt, t) => {
        const r = track.getBoundingClientRect();
        const target = Math.max(0, Math.min(1, -r.top / (r.height - innerHeight)));
        sm.p += (target - sm.p) * Math.min(1, dt * 8);
        const p = sm.p;
        // capitolo 1: il flacone gira; 2: si riempie di colore; 3: si apre e la camera si avvicina
        const rot = p * 1.6 + t * .015;
        set(rot, ease(seg(p, .3, .62)), ease(seg(p, .7, .92)), ease(seg(p, .66, .95)));
        const k = p < .33 ? 0 : p < .66 ? 1 : 2;
        bars.forEach((b, i) => b.style.setProperty('--f', seg(p, i / 3, (i + 1) / 3).toFixed(3)));
        cue.style.opacity = Math.max(0, 1 - p * 12).toFixed(2);
        if (k !== shown) {
          chs.forEach((c, i) => {
            if (i === k) { c.style.visibility = 'visible'; c.animate([{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' }); }
            else if (i === shown) c.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-14px)' }], { duration: 300, fill: 'both' });
            else { c.style.visibility = 'hidden'; }
          });
          shown = k;
        }
      });
    });
  }

  function viewBanner(x){
    exPage(x, `
      <div class="demo cream">
        <div class="bn-area">
          <div class="bn-col"><span class="mono">300 × 250 · riquadro</span>
            <div class="bn m" data-f="300×250"><span class="tag">AD</span>
              <div class="ad"><p class="k mono">Nuova collezione</p><p class="h">Scoprila con<br><span class="hl">un gesto.</span></p><a class="go" href="#/banner-interattivo" hidden>Scopri</a></div>
              <canvas></canvas></div>
          </div>
          <div class="bn-col"><span class="mono">320 × 100 · mobile</span>
            <div class="bn s" data-f="320×100"><span class="tag">AD</span>
              <div class="ad"><div><p class="k mono">Nuova collezione</p><p class="h">Scoprila con <span class="hl">un gesto.</span></p></div><a class="go" href="#/banner-interattivo" hidden>Scopri</a></div>
              <canvas></canvas></div>
          </div>
        </div>
        <div class="stats-head mono"><span>Cosa misuriamo, da questi due banner (dati di questa prova)</span><button class="mono" id="bnReplay">Rigioca</button></div>
        <div class="stats">
          <div><span class="mono">Passaggi</span><b id="sPass">0</b></div>
          <div><span class="mono">Gesti</span><b id="sGest">0</b></div>
          <div><span class="mono">Banner scoperti</span><b id="sDone">0</b></div>
          <div><span class="mono">Clic su Scopri</span><b id="sClick">0</b></div>
          <div><span class="mono">Tempo di gioco</span><b id="sTime">0,0 s</b></div>
        </div>
      </div>`, () => {
      const stats = { pass: 0, gest: 0, done: 0, click: 0, time: 0 };
      const show = () => {
        $('#sPass').textContent = stats.pass; $('#sGest').textContent = stats.gest; $('#sDone').textContent = stats.done; $('#sClick').textContent = stats.click;
        $('#sTime').textContent = stats.time.toFixed(1).replace('.', ',') + ' s';
      };
      const banners = [...document.querySelectorAll('.bn')].map(bn => {
        const cv = bn.querySelector('canvas'), ctx = cv.getContext('2d'), go = bn.querySelector('.go');
        let w = 0, h = 0, d = 1, done = false, active = false, lastT = 0, moves = 0;
        function cover(){
          d = Math.min(devicePixelRatio || 1, 2); w = bn.clientWidth; h = bn.clientHeight;
          cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
          ctx.globalCompositeOperation = 'source-over'; cv.getAnimations().forEach(a => a.cancel()); cv.style.opacity = 1; done = false; moves = 0; go.hidden = true;
          const g = ctx.createLinearGradient(0, 0, w, h);
          g.addColorStop(0, '#FF7A2A'); g.addColorStop(.35, '#FF3D6E'); g.addColorStop(.7, '#E91FA8'); g.addColorStop(1, '#FF1CD6');
          ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = `500 ${h > 150 ? 20 : 16}px 'Space Grotesk', sans-serif`;
          ctx.fillText(touchLike ? 'Passa il dito qui sopra' : 'Passa qui sopra', w / 2, h / 2 - (h > 150 ? 10 : 8));
          ctx.font = `400 ${h > 150 ? 11 : 9}px 'DM Mono', monospace`;
          ctx.fillText('SCOPRI IL MESSAGGIO', w / 2, h / 2 + (h > 150 ? 18 : 12));
        }
        cover();
        function cleared(){
          const data = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, n = 0;
          for (let i = 3; i < data.length; i += 4 * 37) { n++; if (data[i] < 20) clear++; }
          return clear / n;
        }
        function reveal(){
          done = true; stats.done++; show();
          cv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).finished.then(() => { cv.style.opacity = 0; });
          go.hidden = false; go.classList.remove('pop'); void go.offsetWidth; go.classList.add('pop');
        }
        const erase = e => {
          if (done) return;
          const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath(); ctx.arc(px, py, h > 150 ? 30 : 22, 0, Math.PI * 2); ctx.fill();
          if (++moves % 6 === 0 && cleared() > .5) reveal();
          const now = performance.now(); if (lastT) stats.time += Math.min(.1, (now - lastT) / 1000); lastT = now; show();
        };
        listen(cv, 'pointerenter', e => { if (!done) { stats.pass++; active = true; lastT = 0; show(); } });
        listen(cv, 'pointerdown', e => { if (done) return; stats.gest++; show(); cv.setPointerCapture(e.pointerId); erase(e); });
        listen(cv, 'pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) erase(e); });
        listen(cv, 'pointerleave', () => { active = false; lastT = 0; });
        listen(cv, 'pointerup', () => { lastT = 0; });
        listen(go, 'click', e => { e.preventDefault(); stats.click++; show(); toast('Nel banner vero, qui si apre la pagina della campagna. E il clic finisce nel report.'); });
        return { cover };
      });
      $('#bnReplay').addEventListener('click', () => banners.forEach(b => b.cover()));
    });
  }

    exPage(x, `

        box.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b);
      }));
      seg('lcN', b => { s.st.beams = +b.dataset.v; });
      seg('lcC', b => { s.st.colors = PAL[+b.dataset.k].c.slice(); });
      seg('lcM', b => { s.st.motion = +b.dataset.v; });
      let on = true;
      $('#lcGo').addEventListener('click', () => {
        on = !on; s.st.level = on ? 1 : 0;
        $('#lcGo').textContent = on ? 'Buio in sala' : 'Si va in scena';
        if (on) s.ripple(.5, .2, true);
      });
    });

  function viewParete(x){
    exPage(x, `
      <div class="demo dark withctl" id="wl">
        <div class="canvas-box wall" style="position:relative">
          <canvas class="full"></canvas>
          <p class="people mono"><i></i><span id="wlN">7</span> in sala</p>
        </div>
        <div class="qr" aria-label="QR di esempio">
          <div class="code" id="wlQR" aria-hidden="true"></div>
          <div><p>All'evento, ognuno partecipa dal proprio telefono inquadrando il QR code.</p><span class="mono">QR di esempio · simulazione nel browser</span></div>
        </div>
        <div class="controls dk">
          <label class="ctl"><span class="mono">Persone simulate</span><input type="range" id="wlG" min="0" max="12" step="1" value="6"></label>
          <button class="btn ghost" id="wlClear" style="margin-left:auto;background:transparent;color:var(--cream)">Pulisci</button>
          <button class="btn" id="wlSave" style="margin-left:0">Salva l'immagine</button>
        </div>
      </div>`, () => {
      const box = $('#wl');
      const w = wall(box.querySelector('canvas'), { ghosts: 6 });
      // QR finto: angoli di riferimento veri e moduli casuali, non porta da nessuna parte
      const N = 21, q = $('#wlQR'), fin = (x, y) => [[0, 0], [N - 7, 0], [0, N - 7]].some(([a, b]) => x >= a && x < a + 7 && y >= b && y < b + 7);
      const finOn = (x, y) => { for (const [a, b] of [[0, 0], [N - 7, 0], [0, N - 7]]) { const dx = x - a, dy = y - b; if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); } return false; };
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      q.innerHTML = Array.from({ length: N * N }, (_, i) => { const x = i % N, y = (i / N) | 0; return `<i class="${(fin(x, y) ? finOn(x, y) : rnd() > .52) ? 'on' : ''}"></i>`; }).join('');
      const people = () => { $('#wlN').textContent = w.count() + 1; };
      $('#wlG').addEventListener('input', e => { w.st.ghosts = +e.target.value; people(); });
      $('#wlClear').addEventListener('click', () => w.clear());
      $('#wlSave').addEventListener('click', () => saveCanvas(w.canvas, 'parete-digitale.png', 'Immagine salvata: è il ricordo condiviso della serata, da usare sui social dell\'evento.'));
      people();
    });
  }

  const VIEWS = { configuratore: viewConfig, 'scroll-di-prodotto': viewScroll, 'banner-interattivo': viewBanner, 'luci-di-scena': viewLuci, 'parete-digitale': viewParete, 'invito-su-misura': viewInvito };
  function route(){
    cleanups.forEach(fn => { try { fn(); } catch(e){} }); cleanups = [];
    const slug = location.hash.replace(/^#\/?/, '');
    const x = EX.find(e => e.slug === slug);
    if (x) VIEWS[slug](x); else viewIndex();
    scrollTo(0, 0);
    app.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.16,1,.3,1)' });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.js-brief'); if (!b) return;
    e.preventDefault();
    toast(b.dataset.area ? `Nel sito questo tasto apre il brief con ${b.dataset.area} già scelto.` : 'Nel sito questo tasto apre il brief "Raccontaci il progetto".');
  });
  addEventListener('hashchange', route);
  route();
})();
</script>
